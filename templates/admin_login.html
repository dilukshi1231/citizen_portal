<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Citizen Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-gray-900 to-gray-700 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md px-4">
        <div class="bg-white rounded-2xl shadow-2xl p-8">
            <!-- Logo/Header -->
            <div class="text-center mb-8">
                <div class="bg-gray-900 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                    </svg>
                </div>
                <h1 class="text-3xl font-bold text-gray-900">Admin Portal</h1>
                <p class="text-gray-600 mt-2">Analytics & Management Dashboard</p>
            </div>

            <!-- Alert Box -->
            <div id="alert-box" class="hidden mb-4 p-4 rounded-lg"></div>

            <!-- Login Form -->
            <form id="admin-login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                        Username
                    </label>
                    <input 
                        type="text" 
                        name="username" 
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-900"
                        placeholder="admin"
                    />
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                        </svg>
                        Password
                    </label>
                    <input 
                        type="password" 
                        name="password" 
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-900"
                        placeholder="••••••••"
                    />
                </div>

                <button 
                    type="submit" 
                    id="admin-login-btn"
                    class="w-full bg-gray-900 text-white py-3 rounded-lg hover:bg-gray-800 transition-colors font-medium"
                >
                    🔐 Admin Sign In
                </button>
            </form>

            <!-- Back to User Portal -->
            <div class="mt-6 text-center">
                <a href="/user/login" class="text-sm text-gray-500 hover:text-gray-700">
                    ← Back to Citizen Portal
                </a>
            </div>

            <!-- Warning Notice -->
            <div class="mt-6 p-4 bg-yellow-50 border border-yellow-200 rounded-lg">
                <p class="text-xs text-yellow-800">
                    <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                    </svg>
                    Authorized personnel only. All access is logged.
                </p>
            </div>
        </div>

        <!-- Default Credentials (Dev Only) -->
        <div class="mt-4 bg-gray-800 text-white p-4 rounded-lg text-sm">
            <p class="font-semibold mb-2">🔑 Default Credentials:</p>
            <p>Username: <code class="bg-gray-900 px-2 py-1 rounded">admin</code></p>
            <p>Password: <code class="bg-gray-900 px-2 py-1 rounded">admin123</code></p>
        </div>
    </div>

    <script>
        console.log('Admin login page loaded');
        
        document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            console.log('Form submitted');
            
            const btn = document.getElementById('admin-login-btn');
            const alertBox = document.getElementById('alert-box');
            const formData = new FormData(e.target);
            
            btn.disabled = true;
            btn.textContent = 'Verifying...';
            alertBox.classList.add('hidden');
            
            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: formData.get('username'),
                        password: formData.get('password')
                    })
                });
                
                console.log('Response status:', response.status);
                const data = await response.json();
                console.log('Response data:', data);
                
                if (response.ok) {
                    alertBox.className = 'mb-4 p-4 rounded-lg bg-green-100 text-green-700';
                    alertBox.textContent = '✓ Access granted! Loading dashboard...';
                    alertBox.classList.remove('hidden');
                    
                    setTimeout(() => {
                        window.location.href = data.redirect;
                    }, 1000);
                } else {
                    throw new Error(data.error || 'Authentication failed');
                }
            } catch (error) {
                console.error('Login error:', error);
                alertBox.className = 'mb-4 p-4 rounded-lg bg-red-100 text-red-700';
                alertBox.textContent = '✗ ' + error.message;
                alertBox.classList.remove('hidden');
                
                btn.disabled = false;
                btn.textContent = '🔐 Admin Sign In';
            }
        });
        
        console.log('Script initialized successfully');
    </script>
</body>
</html>
