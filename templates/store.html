<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Public Store - Citizen Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.payhere.lk/lib/payhere.js"></script>
    
    <style>
        .product-card {
            display: flex;
            flex-direction: column;
            height: 100%;
            transition: all 0.2s;
        }
        .product-image {
            object-fit: cover;
        }
        .product-info {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .product-details {
            flex: 1;
        }
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .discount-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ef4444;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <a href="/" class="text-blue-600 hover:text-blue-800">← Back to Portal</a>
                <h1 class="text-2xl font-bold text-gray-900">🛒 Public Store</h1>
            </div>
            <div class="flex items-center gap-4">
                <input 
                    type="text" 
                    id="search-input" 
                    placeholder="Search products..."
                    class="px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
                <button onclick="viewCart()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                    🛒 Cart (<span id="cart-count">0</span>)
                </button>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 py-6">
        <!-- Test Card Info Banner -->
        <div class="bg-yellow-50 border-2 border-yellow-400 rounded-lg p-4 mb-6">
            <h3 class="font-bold text-yellow-800 mb-2">🧪 SANDBOX TEST MODE</h3>
            <p class="text-sm text-yellow-700 mb-2">Use these test card details for payment:</p>
            <div class="grid grid-cols-2 gap-4 text-sm">
                <div><strong>Card:</strong> 5303732372101006</div>
                <div><strong>Expiry:</strong> 12/25</div>
                <div><strong>CVV:</strong> 123</div>
                <div><strong>Name:</strong> Any Name</div>
            </div>
        </div>
        
        <div class="flex gap-6">
            <!-- Filters Sidebar -->
            <aside class="w-64 bg-white p-6 rounded-lg shadow-md h-fit sticky top-24">
                <h3 class="text-lg font-bold mb-4">Filters</h3>
                
                <div class="mb-6">
                    <h4 class="font-semibold mb-2">Categories</h4>
                    <div id="category-filters"></div>
                </div>
                
                <div class="mb-6">
                    <h4 class="font-semibold mb-2">Price Range</h4>
                    <input 
                        type="range" 
                        id="price-range" 
                        min="0" 
                        max="500000" 
                        step="1000"
                        value="500000"
                        class="w-full"
                    />
                    <div class="flex justify-between text-sm text-gray-600 mt-2">
                        <span>LKR <span id="min-price">0</span></span>
                        <span>LKR <span id="max-price">500,000</span></span>
                    </div>
                </div>
                
                <button onclick="applyFilters()" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
                    Apply Filters
                </button>
                <button onclick="clearFilters()" class="w-full mt-2 bg-gray-200 text-gray-700 py-2 rounded-lg hover:bg-gray-300">
                    Clear All
                </button>
            </aside>

            <!-- Products Grid -->
            <main class="flex-1">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold">Featured Products</h2>
                    <select id="sort-by" onchange="loadProducts()" class="px-4 py-2 border rounded-lg">
                        <option value="featured">Featured</option>
                        <option value="price_low">Price: Low to High</option>
                        <option value="price_high">Price: High to Low</option>
                        <option value="rating">Highest Rated</option>
                    </select>
                </div>
                
                <div id="products-container" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Products will be loaded here -->
                </div>
                
                <div id="loading" class="text-center py-20 hidden">
                    <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
                    <p class="mt-4 text-gray-600">Loading products...</p>
                </div>
            </main>
        </div>
    </div>

    <!-- Cart Modal -->
    <div id="cart-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center">
        <div class="bg-white rounded-lg p-6 max-w-2xl w-full max-h-[80vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold">Shopping Cart</h2>
                <button onclick="closeCart()" class="text-gray-600 hover:text-gray-900 text-2xl">&times;</button>
            </div>
            <div id="cart-items"></div>
            <div class="mt-6 pt-6 border-t">
                <div class="flex justify-between text-xl font-bold mb-4">
                    <span>Total:</span>
                    <span>LKR <span id="cart-total">0</span></span>
                </div>
                <button onclick="checkout()" class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 font-semibold">
                    Proceed to Payment
                </button>
            </div>
        </div>
    </div>

    <script>
        // Store state
        let cart = [];
        let currentProducts = [];
        let currentFilters = {};

        // Initialize store
        async function initStore() {
            await loadCategories();
            await loadProducts();
            updateCartCount();
            
            // Check for payment success/cancel in URL
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('order_success')) {
                showNotification('Payment successful! Order ID: ' + urlParams.get('order_success'), 'success');
            }
            if (urlParams.get('payment_cancelled')) {
                showNotification('Payment was cancelled', 'error');
            }
        }

        async function loadCategories() {
            try {
                const res = await fetch('/api/store/categories');
                const data = await res.json();
                const container = document.getElementById('category-filters');
                container.innerHTML = '';
                
                data.categories.forEach(category => {
                    const label = document.createElement('label');
                    label.className = 'flex items-center gap-2 mb-2 cursor-pointer';
                    label.innerHTML = `
                        <input type="checkbox" name="category" value="${category}" class="rounded">
                        <span class="text-sm">${category.charAt(0).toUpperCase() + category.slice(1)}</span>
                    `;
                    container.appendChild(label);
                });
            } catch (error) {
                console.error('Error loading categories:', error);
            }
        }

        async function loadProducts() {
            const loading = document.getElementById('loading');
            loading.classList.remove('hidden');
            
            const params = new URLSearchParams(currentFilters);
            
            try {
                const res = await fetch(`/api/store/products?${params}`);
                currentProducts = await res.json();
                displayProducts(currentProducts);
            } catch (error) {
                console.error('Error loading products:', error);
                showNotification('Failed to load products', 'error');
            } finally {
                loading.classList.add('hidden');
            }
        }

        function displayProducts(products) {
            const container = document.getElementById('products-container');
            
            if (products.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center py-20 text-gray-600">No products found.</div>';
                return;
            }
            
            container.innerHTML = products.map(product => {
                const discount = product.original_price 
                    ? Math.round((1 - product.price/product.original_price) * 100)
                    : 0;
                
                return `
                    <div class="product-card bg-white rounded-lg shadow-md overflow-hidden cursor-pointer" onclick="viewProduct('${product.id}')">
                        <div class="relative">
                            <img 
                                src="${product.images && product.images[0] ? product.images[0] : '/static/placeholder.jpg'}" 
                                alt="${product.name}"
                                class="w-full h-48 object-cover"
                                onerror="this.src='/static/placeholder.jpg'"
                            />
                            ${discount > 0 ? `<div class="discount-badge">-${discount}%</div>` : ''}
                        </div>
                        
                        <div class="product-info p-4">
                            <div class="product-details">
                                <h3 class="font-semibold text-lg mb-2 h-14 line-clamp-2">${product.name}</h3>
                                
                                <div class="mb-3">
                                    ${product.original_price ? 
                                        `<div class="text-gray-500 line-through text-sm">LKR ${product.original_price.toLocaleString()}</div>` 
                                        : '<div class="h-5"></div>'
                                    }
                                    <div class="text-blue-600 font-bold text-xl">LKR ${product.price.toLocaleString()}</div>
                                </div>
                                
                                <div class="flex items-center gap-1 mb-4">
                                    <span class="text-yellow-500">${'★'.repeat(Math.floor(product.rating || 4))}</span>
                                    <span class="text-gray-400">${'★'.repeat(5 - Math.floor(product.rating || 4))}</span>
                                    <span class="text-sm text-gray-600">(${product.reviews_count || 0})</span>
                                </div>
                            </div>
                            
                            <button 
                                onclick="event.stopPropagation(); addToCart('${product.id}')"
                                class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition-colors"
                            >
                                Add to Cart
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function addToCart(productId) {
            const product = currentProducts.find(p => p.id === productId);
            if (!product) return;
            
            const existingItem = cart.find(item => item.id === productId);
            
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({
                    id: productId,
                    name: product.name,
                    price: product.price,
                    quantity: 1
                });
            }
            
            updateCart();
            showNotification(`${product.name} added to cart!`, 'success');
        }

        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = `fixed top-20 right-4 px-6 py-3 rounded-lg shadow-lg z-50 ${
                type === 'success' ? 'bg-green-500' : 'bg-red-500'
            } text-white`;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        function updateCart() {
            updateCartCount();
            updateCartModal();
        }

        function updateCartCount() {
            const count = cart.reduce((total, item) => total + item.quantity, 0);
            document.getElementById('cart-count').textContent = count;
        }

        function viewCart() {
            document.getElementById('cart-modal').classList.remove('hidden');
            updateCartModal();
        }

        function closeCart() {
            document.getElementById('cart-modal').classList.add('hidden');
        }

        function updateCartModal() {
            const container = document.getElementById('cart-items');
            const total = document.getElementById('cart-total');
            
            if (cart.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-600 py-8">Your cart is empty</p>';
                total.textContent = '0';
                return;
            }
            
            container.innerHTML = cart.map(item => `
                <div class="flex items-center gap-4 mb-4 pb-4 border-b">
                    <div class="flex-1">
                        <h4 class="font-semibold">${item.name}</h4>
                        <div class="text-blue-600 font-bold">LKR ${item.price.toLocaleString()}</div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button 
                            onclick="updateQuantity('${item.id}', -1)"
                            class="bg-gray-200 px-3 py-1 rounded hover:bg-gray-300"
                        >-</button>
                        <span class="font-semibold w-8 text-center">${item.quantity}</span>
                        <button 
                            onclick="updateQuantity('${item.id}', 1)"
                            class="bg-gray-200 px-3 py-1 rounded hover:bg-gray-300"
                        >+</button>
                    </div>
                </div>
            `).join('');
            
            const cartTotal = cart.reduce((total, item) => total + (item.price * item.quantity), 0);
            total.textContent = cartTotal.toLocaleString();
        }

        function updateQuantity(productId, change) {
            const item = cart.find(item => item.id === productId);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.id !== productId);
                }
                updateCart();
            }
        }

        function applyFilters() {
            const categoryCheckboxes = document.querySelectorAll('input[name="category"]:checked');
            const priceRange = document.getElementById('price-range');
            
            currentFilters = {
                category: Array.from(categoryCheckboxes).map(cb => cb.value).join(','),
                max_price: parseInt(priceRange.value)
            };
            
            document.getElementById('max-price').textContent = parseInt(priceRange.value).toLocaleString();
            loadProducts();
        }

        function clearFilters() {
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
            document.getElementById('price-range').value = 500000;
            document.getElementById('max-price').textContent = '500,000';
            currentFilters = {};
            loadProducts();
        }

        // Update price display on range change
        document.addEventListener('DOMContentLoaded', () => {
            const priceRange = document.getElementById('price-range');
            if (priceRange) {
                priceRange.addEventListener('input', (e) => {
                    document.getElementById('max-price').textContent = parseInt(e.target.value).toLocaleString();
                });
            }
        });

        async function checkout() {
            if (cart.length === 0) {
                showNotification('Your cart is empty', 'error');
                return;
            }

            try {
                const cartTotal = cart.reduce((total, item) => total + (item.price * item.quantity), 0);
                
                // Create order first
                console.log('🛒 STEP 1: Creating order...');
                console.log('📦 Cart items:', cart);
                console.log('💰 Total amount:', cartTotal);
                
                const orderResponse = await fetch('/api/store/order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        items: cart,
                        total_amount: cartTotal,
                        payment_method: 'payhere'
                    })
                });

                if (!orderResponse.ok) {
                    const errorData = await orderResponse.json();
                    console.error('❌ Order creation failed:', errorData);
                    throw new Error(errorData.error || 'Failed to create order');
                }

                const orderData = await orderResponse.json();
                console.log('✅ Order created successfully:', orderData);
                console.log('📋 Order ID:', orderData.order_id);
                const orderId = orderData.order_id;

                // Generate payment hash
                console.log('\n🔐 STEP 2: Generating payment hash...');
                const hashPayload = {
                    order_id: orderId,
                    amount: cartTotal,
                    currency: 'LKR'
                };
                console.log('📤 Hash request payload:', hashPayload);
                
                const hashResponse = await fetch('/api/payhere/generate-hash', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(hashPayload)
                });

                if (!hashResponse.ok) {
                    const errorData = await hashResponse.json();
                    console.error('❌ Hash generation failed:', errorData);
                    throw new Error(errorData.error || 'Failed to generate payment hash');
                }

                const hashData = await hashResponse.json();
                console.log('✅ Hash generated successfully');
                console.log('🔑 Merchant ID:', hashData.merchant_id);
                console.log('🔑 Hash:', hashData.hash);
                console.log('💵 Amount:', hashData.amount);
                console.log('💱 Currency:', hashData.currency);
            

                // Prepare PayHere payment object
                const payment = {
                    sandbox: true, // Set to false in production
                    merchant_id: hashData.merchant_id,
                    return_url: window.location.origin + '/api/payhere/return?order_id=' + orderId,
                    cancel_url: window.location.origin + '/api/payhere/cancel',
                    notify_url: window.location.origin + '/api/payhere/notify',
                    order_id: orderId,
                    items: cart.map(item => item.name).join(', '),
                    amount: cartTotal.toFixed(2),
                    currency: 'LKR',
                    hash: hashData.hash,
                    first_name: 'Test',
                    last_name: 'Customer',
                    email: 'test@example.com',
                    phone: '0771234567',
                    address: '123 Test Street',
                    city: 'Colombo',
                    country: 'Sri Lanka'
                };

                // Configure PayHere callbacks
                payhere.onCompleted = function(orderId) {
                    console.log('Payment completed. Order ID:', orderId);
                    cart = [];
                    updateCart();
                    closeCart();
                    showNotification('Payment successful! Order ID: ' + orderId, 'success');
                    setTimeout(() => {
                        window.location.href = '/store?order_success=' + orderId;
                    }, 2000);
                };

                payhere.onDismissed = function() {
                    console.log('Payment dismissed');
                    showNotification('Payment was cancelled', 'error');
                };

                payhere.onError = function(error) {
                    console.log('Payment error:', error);
                    showNotification('Payment failed: ' + error, 'error');
                };

                // Start payment
                payhere.startPayment(payment);

            } catch (error) {
                console.error('Checkout error:', error);
                showNotification('Checkout failed. Please try again.', 'error');
            }
        }

        function viewProduct(productId) {
            console.log('View product:', productId);
            // Implement product detail view if needed
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', initStore);
    </script>
</body>
</html>
