
<!DOCTYPE html>
<!-- templates/payment_success.html -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - GovConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes checkmark {
            0% { stroke-dashoffset: 100; }
            100% { stroke-dashoffset: 0; }
        }
        .checkmark {
            animation: checkmark 0.5s ease-in-out;
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-green-50 to-blue-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full">
        <div class="bg-white rounded-2xl shadow-2xl p-8 text-center">
            <!-- Success Icon -->
            <svg class="w-24 h-24 mx-auto mb-6" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="#10b981" opacity="0.2"/>
                <path class="checkmark" d="M25,50 L40,65 L75,30" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            
            <h1 class="text-3xl font-bold text-gray-900 mb-4">Payment Successful!</h1>
            <p class="text-gray-600 mb-6">Thank you for your purchase. Your order has been confirmed.</p>
            
            <div class="bg-gray-50 rounded-lg p-6 mb-6">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-sm text-gray-600">Order ID:</span>
                    <span class="font-mono font-bold text-blue-600" id="order-id">Processing...</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-sm text-gray-600">Status:</span>
                    <span class="bg-green-100 text-green-800 px-3 py-1 rounded-full text-sm font-semibold">Paid</span>
                </div>
            </div>
            
            <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6">
                <p class="text-sm text-blue-800">
                    ðŸ"§ A confirmation email has been sent to your registered email address.
                </p>
            </div>
            
            <div class="space-y-3">
                <a href="/store" class="block w-full py-3 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition">
                    Continue Shopping
                </a>
                <a href="/dashboard" class="block w-full py-3 bg-gray-200 text-gray-700 font-semibold rounded-lg hover:bg-gray-300 transition">
                    View My Orders
                </a>
            </div>
        </div>
        
        <p class="text-center text-sm text-gray-500 mt-6">
            Need help? Contact support at support@govconnect.lk
        </p>
    </div>
    
    <script>
        // Get order ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('order_id');
        
        if (orderId) {
            document.getElementById('order-id').textContent = orderId;
            
            // Check payment status
            fetch(`/api/store/payment/status/${orderId}`)
                .then(res => res.json())
                .then(data => {
                    console.log('Payment status:', data);
                })
                .catch(err => console.error('Error:', err));
        }
    </script>
</body>
</html>
