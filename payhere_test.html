<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayHere Integration Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.payhere.lk/lib/payhere.js"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <div class="bg-white rounded-lg shadow-lg p-6">
            <h1 class="text-3xl font-bold mb-6">🧪 PayHere Integration Test</h1>
            
            <!-- Configuration Display -->
            <div class="bg-blue-50 border-2 border-blue-200 rounded-lg p-4 mb-6">
                <h2 class="font-bold text-lg mb-2">📋 Configuration</h2>
                <div id="config-display" class="font-mono text-sm"></div>
            </div>
            
            <!-- Test Payment Button -->
            <div class="mb-6">
                <button onclick="testPayment()" class="bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700 text-lg font-semibold">
                    🚀 Test Payment (LKR 100.00)
                </button>
            </div>
            
            <!-- Debug Console -->
            <div class="bg-gray-900 text-green-400 rounded-lg p-4 font-mono text-sm overflow-auto max-h-96">
                <div class="flex justify-between items-center mb-2">
                    <span class="font-bold">🔍 Debug Console</span>
                    <button onclick="clearConsole()" class="bg-red-600 text-white px-3 py-1 rounded text-xs">Clear</button>
                </div>
                <div id="debug-console"></div>
            </div>
        </div>
    </div>

    <script>
        const debugLog = [];
        
        function log(message, type = 'info') {
            const timestamp = new Date().toISOString().split('T')[1].split('.')[0];
            const colors = {
                'info': 'text-green-400',
                'error': 'text-red-400',
                'warning': 'text-yellow-400',
                'success': 'text-blue-400'
            };
            
            debugLog.push({timestamp, message, type});
            
            const consoleDiv = document.getElementById('debug-console');
            const entry = document.createElement('div');
            entry.className = colors[type];
            entry.innerHTML = `<span class="text-gray-500">[${timestamp}]</span> ${message}`;
            consoleDiv.appendChild(entry);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
            
            console.log(`[${type.toUpperCase()}]`, message);
        }
        
        function clearConsole() {
            document.getElementById('debug-console').innerHTML = '';
            debugLog.length = 0;
        }
        
        async function testPayment() {
            clearConsole();
            log('═══════════════════════════════════════════', 'info');
            log('🚀 STARTING PAYHERE TEST PAYMENT', 'success');
            log('═══════════════════════════════════════════', 'info');
            
            try {
                // Step 1: Create test order
                log('\n📦 STEP 1: Creating test order...', 'info');
                const testAmount = 100.00;
                
                const orderResponse = await fetch('/api/store/order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        items: [{
                            id: 'test_item',
                            name: 'Test Item',
                            price: testAmount,
                            quantity: 1
                        }],
                        total_amount: testAmount,
                        payment_method: 'payhere'
                    })
                });
                
                if (!orderResponse.ok) {
                    throw new Error('Order creation failed');
                }
                
                const orderData = await orderResponse.json();
                log(`✅ Order created: ${orderData.order_id}`, 'success');
                
                // Step 2: Generate hash
                log('\n🔐 STEP 2: Generating payment hash...', 'info');
                const hashResponse = await fetch('/api/payhere/generate-hash', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        order_id: orderData.order_id,
                        amount: testAmount,
                        currency: 'LKR'
                    })
                });
                
                if (!hashResponse.ok) {
                    throw new Error('Hash generation failed');
                }
                
                const hashData = await hashResponse.json();
                log(`✅ Hash generated: ${hashData.hash}`, 'success');
                log(`   Merchant ID: ${hashData.merchant_id}`, 'info');
                log(`   Amount: ${hashData.amount}`, 'info');
                
                if (hashData.debug) {
                    log(`\n🔍 Debug Info:`, 'warning');
                    log(`   Secret MD5: ${hashData.debug.merchant_secret_md5}`, 'info');
                    log(`   Hash String: ${hashData.debug.hash_string}`, 'info');
                    log(`   Hash String Length: ${hashData.debug.hash_string_length}`, 'info');
                }
                
                // Step 3: Prepare PayHere payment
                log('\n💳 STEP 3: Preparing PayHere payment object...', 'info');
                const payment = {
                    sandbox: true,
                    merchant_id: hashData.merchant_id,
                    return_url: window.location.origin + '/payment-return',
                    cancel_url: window.location.origin + '/payment-cancel',
                    notify_url: window.location.origin + '/payment-notify',
                    order_id: orderData.order_id,
                    items: 'Test Item',
                    amount: hashData.amount,
                    currency: 'LKR',
                    hash: hashData.hash,
                    first_name: 'Test',
                    last_name: 'Customer',
                    email: 'test@example.com',
                    phone: '0771234567',
                    address: 'Test Address',
                    city: 'Colombo',
                    country: 'Sri Lanka'
                };
                
                log('Payment Object:', 'info');
                log(JSON.stringify(payment, null, 2), 'info');
                
                // Step 4: Configure callbacks
                log('\n⚙️ STEP 4: Configuring callbacks...', 'info');
                
                payhere.onCompleted = function(orderId) {
                    log(`\n✅ PAYMENT COMPLETED!`, 'success');
                    log(`Order ID: ${orderId}`, 'success');
                };
                
                payhere.onDismissed = function() {
                    log(`\n⚠️ PAYMENT DISMISSED`, 'warning');
                };
                
                payhere.onError = function(error) {
                    log(`\n❌ PAYMENT ERROR: ${error}`, 'error');
                    if (typeof error === 'object') {
                        log(JSON.stringify(error, null, 2), 'error');
                    }
                };
                
                // Step 5: Launch payment
                log('\n🚀 STEP 5: Launching PayHere...', 'success');
                log('═══════════════════════════════════════════', 'info');
                
                payhere.startPayment(payment);
                
            } catch (error) {
                log('\n❌ ERROR OCCURRED:', 'error');
                log(error.message, 'error');
                log(error.stack, 'error');
            }
        }
        
        // Display configuration on load
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const hashResponse = await fetch('/api/payhere/generate-hash', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        order_id: 'CONFIG_TEST',
                        amount: 100,
                        currency: 'LKR'
                    })
                });
                
                const data = await hashResponse.json();
                
                document.getElementById('config-display').innerHTML = `
                    <div class="space-y-1">
                        <div>Merchant ID: <span class="text-blue-600 font-bold">${data.merchant_id}</span></div>
                        <div>Test Hash: <span class="text-green-600">${data.hash}</span></div>
                        <div>Hash Length: <span class="text-purple-600">${data.hash.length} chars</span></div>
                        ${data.debug ? `<div class="mt-2 pt-2 border-t border-blue-300">
                            <div class="text-xs">Secret MD5: ${data.debug.merchant_secret_md5}</div>
                            <div class="text-xs">Hash String Length: ${data.debug.hash_string_length}</div>
                        </div>` : ''}
                    </div>
                `;
            } catch (error) {
                document.getElementById('config-display').innerHTML = `
                    <div class="text-red-600">❌ Failed to load configuration: ${error.message}</div>
                `;
            }
        });
    </script>
</body>
</html>
