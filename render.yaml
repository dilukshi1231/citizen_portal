services:
  - type: web
    name: citizen-services-portal
    env: python
    region: oregon
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python build_ai_index.py || echo "Index build failed, continuing..."
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MONGO_URI
        sync: false
      - key: FLASK_SECRET
        generateValue: true
      - key: ADMIN_PWD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PORT
        value: 10000
      - key: DEBUG
        value: False
    healthCheckPath: /
    autoDeploy: true